<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A lightweight, focused to-do list dashboard with Pomodoro timer and quick links">
    <title>To-Do List Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Settings Button & Panel -->
    <div class="settings-container">
        <button class="settings-btn" id="settings-toggle" aria-label="Settings">⚙️</button>
        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h3>Settings</h3>
                <button class="settings-close" id="settings-close">✕</button>
            </div>
            <div class="settings-content">
                <!-- Theme Toggle -->
                <div class="settings-group">
                    <label for="theme-toggle">Dark Mode</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="theme-toggle" class="toggle-checkbox">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <!-- Custom Greeting Name -->
                <div class="settings-group">
                    <label for="custom-greeting-name">Greeting Name</label>
                    <input type="text" id="custom-greeting-name" class="settings-input" placeholder="e.g., Alex" maxlength="50">
                    <small>Personalize your greeting</small>
                </div>

                <!-- Timer Duration -->
                <div class="settings-group">
                    <label for="timer-duration">Pomodoro Duration (minutes)</label>
                    <div class="timer-duration-input">
                        <input type="number" id="timer-duration" class="settings-input" min="1" max="60" value="25">
                        <small>Change timer length</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <!-- Greeting Section -->
        <div class="greeting-section">
            <div class="greeting-text">Good Morning</div>
            <div class="time-display">14:35</div>
            <div class="date-display">Monday, August 26, 2024</div>
            <input type="text" class="user-name-input" placeholder="Enter your name">
        </div>

        <!-- Focus Timer Section -->
        <div class="focus-timer">
            <div class="timer-display">25:00</div>
            <div class="timer-controls">
                <button class="timer-btn start-btn">Start</button>
                <button class="timer-btn stop-btn">Stop</button>
                <button class="timer-btn reset-btn">Reset</button>
            </div>
            <div class="timer-status">Ready</div>
        </div>

        <!-- To-Do List Section -->
        <div class="todo-list-section">
            <div class="todo-input-area">
                <input type="text" class="todo-input" placeholder="Add a new task...">
                <button class="add-todo-btn">Add</button>
            </div>
            <div class="todo-validation-message"></div>
            <ul class="todo-list">
                <!-- Todo items will be rendered here by JavaScript -->
            </ul>
            <div class="empty-message show">No tasks yet. Add one to get started!</div>
        </div>

        <!-- Quick Links Section -->
        <div class="quick-links-section">
            <div class="quick-links-header">Quick Links</div>
            <div class="quick-links-input-area">
                <input type="text" class="link-title-input" placeholder="Link title">
                <input type="url" class="link-url-input" placeholder="https://example.com">
                <button class="add-link-btn">Add</button>
            </div>
            <div class="link-validation-message"></div>
            <div class="quick-links-container">
                <!-- Quick links will be rendered here by JavaScript -->
            </div>
            <div class="empty-message show">No quick links yet. Add one to get started!</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
